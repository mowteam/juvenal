name: pwn2own-smart-home
# Bare backend names use Juvenal's SDK-first resolution when the matching SDK is
# installed, with the subprocess backend as the portability fallback.
backend: claude

# Pwn2Own Ireland 2026 - Smart Home category.
#
# This workflow is intentionally target-neutral across the three listed Smart
# Home devices. `initialize-run` turns the operator's inputs into a pinned run
# profile; `device-recon` then derives device-specific facts. No later role may
# substitute assumptions from another smart-home product for those artifacts.
#
# Run against one authorized lab device at a time. At minimum, set the target:
#   juvenal run pwn2own-smart-home.yaml \
#     -D TARGET_DEVICE="Philips Hue Bridge Pro" \
#     -D SOURCE_ROOTS="src,firmware-extracted" \
#     -D DEVICE_ACCESS="isolated lab unit at 192.0.2.10; serial capture available"
#
# `SOURCE_ROOTS`, `FIRMWARE_ARTIFACTS`, and `DEVICE_ACCESS` may truthfully say
# that no such input is available. Initialization records the resulting evidence
# limits instead of allowing downstream agents to invent access.

vars:
  # Required operator selection. The initialization gate rejects this sentinel.
  # Valid targets are re-checked against the official rules at run time because
  # the Sponsor reserves the right to change the device list.
  TARGET_DEVICE: "__REQUIRED_SMART_HOME_TARGET__"
  TARGET_CATEGORY: "Smart Home"
  TARGET_VECTOR: "Remote Code Execution"

  # Comma-separated source, extracted-firmware, SDK, companion-app, or symbol
  # roots available in the Juvenal working directory. `.` is safe as a generic
  # default: initialization inventories what is really present and pins hashes.
  SOURCE_ROOTS: "."

  # Optional raw firmware/update packages, filesystem images, SBOMs, PCAPs, and
  # vendor SDKs. Use workspace-relative paths or an honest `none supplied`.
  FIRMWARE_ARTIFACTS: "none supplied"

  # Known first-party components not present under SOURCE_ROOTS. Initialization
  # and recon must expand this list; it is a hint, never ground truth.
  EXTRA_COMPONENTS: "none declared; discover during initialization"

  # Describe authorized access without embedding secrets: hardware availability,
  # isolated network endpoints, controllable RF equipment, debug/log capture, and
  # whether destructive testing is permitted. Never target public or third-party
  # systems from this workflow.
  DEVICE_ACCESS: "no live device supplied; static analysis only"
  LAB_CONSTRAINTS: >-
    Authorized Pwn2Own research in an isolated lab. Do not scan public address
    space, vendor cloud tenants, or third-party devices. Do not perform destructive
    actions unless the operator explicitly states that the lab unit is disposable.

  CONTEST_RULES_URL: "https://www.zerodayinitiative.com/Pwn2OwnIreland2026Rules.html"

  # Working rules digest, injected into every phase and verifier so no role
  # reasons about contest scope from memory. `initialize-run` MUST re-fetch the
  # official page and record any differences because the rules can change. Keep
  # this free of curly braces - it is rendered
  # through Jinja2 and, in some contexts, str.format.
  P2O_RULES: |
    ### Pwn2Own Ireland 2026 — rules that bind this run

    Source of truth: https://www.zerodayinitiative.com/Pwn2OwnIreland2026Rules.html
    Re-fetch it if any question here is not answered below. Do not rely on
    memory of prior Pwn2Own editions — the categories change every year.

    **Smart Home targets and prizes (attack vector: Remote Code Execution)**
    - Philips Hue Bridge Pro — 40,000 USD / 4 Master of Pwn points
    - Home Assistant Green — 30,000 USD / 3 Master of Pwn points
    - Sonos Era 300 — 50,000 USD / 5 Master of Pwn points

    **What a successful entry is**
    - "A successful entry must leverage a vulnerability to modify the standard
      execution path of a program or process in order to allow the execution of
      arbitrary instructions."
    - "All entries must compromise the target(s) and demonstrate arbitrary code
      execution or retrieve sensitive information."
    - The Sponsor defines the exact sensitive information for an attempt during
      registration. Until that definition is present in `output/run-profile.md`,
      treat disclosure as a useful primitive but do not call it a complete win;
      prioritize the listed Remote Code Execution vector.
    - Entries must defeat "the target's techniques designed to ensure the safe
      execution of code, such as, but not limited to, Data Execution Prevention
      (DEP), Address Space Layout Randomization (ASLR) and/or application
      sandboxing."
    - "If a sandbox is present, a full sandbox escape is required unless
      otherwise stated." Read this alongside the DEP/ASLR sentence above it: a
      "sandbox" here is a confinement boundary designed to contain exploitation,
      which the Sponsor designates. An appliance running its own primary
      application in a container, a service account, or a systemd unit is not
      thereby sandboxed. Do not infer this requirement from a `docker inspect`
      output; infer it from the rules text or a Sponsor ruling recorded in
      `output/run-profile.md`.
    - "The initial vulnerability utilized in the entry must be in the registered
      target." All vulnerabilities must be present in the Sponsor-installed
      software or firmware. A companion app, cloud, router, or neighboring-device
      bug cannot substitute for the target's initial vulnerability.

    **Allowed attack surface for the Smart Home category**
    - "An attempt in this category must be launched against the target's exposed
      network services, RF attack surface, or exposed features from the
      contestant's laptop within the contest network."
    - Nothing else is in the category's attack surface. Physical disassembly,
      debug headers, chip-off, JTAG/UART pads, and attacks that require handling
      the device are not part of it.

    **Authentication requirement (the single most important filter)**
    - "If authentication is present, the exploit must occur prior to
      authentication to the service or include an authentication bypass."
    - Consequence: a vulnerability that requires valid credentials, a valid API
      token, an existing session, or an already-trusted client is NOT an entry
      unless the same chain also demonstrates how the attacker obtains that
      position without credentials.

    **Preconditions that disqualify an entry outright**
    - "Entries that require physically pressing any button on the target, or the
      use of any information, code or PIN printed on the device, are out of
      scope."
    - "Entries that require the contestant to be paired to the target prior to
      the start of the attempt is not in scope."
    - "Entries that require the target to be in an initial-setup, pairing, or
      otherwise uninitialized state are out of scope." The device is already
      onboarded and operational when the attempt begins.
    - "All targets will be installed in their default configurations and fully
      operational state when the attempt begins."
    - "The targets will be running on the latest, fully patched version of the
      operating system available on the selected target ... unless otherwise
      specified."
    - Sponsor discretion exists but cannot be assumed: "Sponsor reserves the
      right, in its sole discretion, to allow non-default configurations if the
      Sponsor deems them to be in the normal use case of the target under test."

    **Execution constraints on the exploit itself**
    - "A successful entry ... must be fully automated and launched in one
      command. The contestant is not allowed to interact with the exploit after
      the attempt has started."
    - The exploit "must require no user interaction beyond the action required
      to launch the attempt and must occur within the user's session with no
      reboots, or logoff/logons."
    - "A contestant has up to three (3) attempts to succeed. Each of the three
      (3) attempts will be individually limited to a time period of ten (10)
      minutes ... All three (3) attempts must be completed within thirty (30)
      minutes, excluding the time needed to setup the device prior to the
      attempt."
    - Reliability therefore matters: a chain that needs a heap groom lasting
      longer than ten minutes, or that succeeds one time in twenty, is not a
      viable entry even if the bug is real.

    **Techniques that reduce the prize but do not disqualify**
    - "If the entry requires a man-in-the-middle attack, ARP spoofing attack, or
      software downgrade attack, Sponsor may, in its sole discretion, choose to
      accept the entry(ies) and offer the prize(s) at a value less than the
      initial prize offering." Flag these; do not reject them.

    **Novelty and single use**
    - "The vulnerabilities utilized in the attack must be unknown, unpublished,
      and/or not previously reported to the vendor or the Sponsor."
    - "If the entry leverages a previously known vulnerability ... Sponsor may,
      in its sole discretion, choose to accept the entry(ies) and offer the
      prize(s) at a value less than the initial prize offering."
    - "A given vulnerability may only be used once across all categories."

    **Deliverable**
    - A whitepaper is mandatory: "Failure to provide a whitepaper will be deemed
      as an incomplete entry and the entry will be disqualified from the
      Contest."
    - "The whitepaper must be provided in Markdown format."
    - "The whitepaper must include the Common Weakness Enumeration (CWE)
      categorization for each of the vulnerability(ies)."
    - "All code listing(s) must include contain line number(s)." Code listings
      in image format are not acceptable.

    **Not in this year's contest**
    - There is no SOHO Smashup category in Pwn2Own Ireland 2026. Do not plan a
      router-pivot chain; the attempt is launched directly from the contestant
      laptop on the contest network.

# Shared cap for the initialization and recon review loops.
max_bounces: 6

phases:
  # ==========================================================================
  # Phase 1 - run initialization. Pins the selected device, current rules,
  # supplied artifacts, and authorized lab capabilities before agents specialize.
  # ==========================================================================
  - id: initialize-run
    backend: claude
    model: claude-opus-5
    prompt: |
      You are initializing an authorized Pwn2Own Ireland 2026 Smart Home
      research run. This phase must tailor a generic workflow to exactly one
      contest device without importing facts from any other device.

      Operator inputs:
      - Target selection: {{ TARGET_DEVICE }}
      - Category / vector: {{ TARGET_CATEGORY }} / {{ TARGET_VECTOR }}
      - Candidate source and extracted-firmware roots: {{ SOURCE_ROOTS }}
      - Raw firmware and supporting artifacts: {{ FIRMWARE_ARTIFACTS }}
      - Declared but unavailable components: {{ EXTRA_COMPONENTS }}
      - Authorized device and lab access: {{ DEVICE_ACCESS }}
      - Lab constraints: {{ LAB_CONSTRAINTS }}
      - Official rules: {{ CONTEST_RULES_URL }}

      {{ P2O_RULES }}

      ## Mission

      Write `output/run-profile.md`. Do not modify source, firmware, repository
      metadata, or lab devices. This file is the immutable identity and evidence
      manifest for the run. Every later phase reads it before acting.

      Use available repository and web-research tools. Re-fetch the official
      rules page now. The embedded digest is a working snapshot, not authority.
      Do not scan public address space or contact a vendor cloud service merely
      because a hostname, token, or endpoint appears in an artifact.

      If `TARGET_DEVICE` is still `__REQUIRED_SMART_HOME_TARGET__`, or if it is
      not a Smart Home target on the current official page, record the failure
      prominently. Never silently choose a device.

      ## Required structure - use these headers verbatim

      # Run Profile - {{ TARGET_DEVICE }}

      ## Initialization status
      Emit exactly one status: `READY`, `READY_WITH_LIMITATIONS`, or `BLOCKED`.
      `BLOCKED` is mandatory for a missing/invalid target or an authorization
      statement that permits testing systems outside an isolated owned lab.

      ## Contest target identity
      Record the exact model, vendor, category, vector, cash prize, and Master of
      Pwn points from the official page. Include the rules URL and UTC retrieval
      timestamp. State whether the selected target list or relevant rules differ
      from the embedded digest.

      ## Rules snapshot
      Extract the current Smart Home scope plus the general successful-entry,
      authentication, patch level, default/operational state, automation,
      attempt-time, novelty, sandbox, reduced-prize, and whitepaper requirements.
      Cite stable section or line descriptions and the URL. Distinguish exact
      rule text from your interpretation.

      ## Source and artifact manifest
      Inventory every path named by `SOURCE_ROOTS` and `FIRMWARE_ARTIFACTS`.
      Classify each as source repository, extracted filesystem, raw firmware or
      update package, binary/symbol bundle, SBOM, PCAP, companion application,
      documentation, or missing. For Git repositories record remote, HEAD SHA,
      branch/tag, dirty state, and relevant release tag. For non-repository files
      record size and SHA-256. For directories record a reproducible tree hash or
      explicitly explain why one cannot be produced. Never claim a path belongs
      to the device until evidence establishes that link.

      ## Shipped-version baseline
      Record the latest fully patched device firmware/software version supported
      by vendor evidence, its release date, and whether the local inputs match it.
      Preserve disagreements: contest registration details supplied by the
      Sponsor outrank public marketing pages, and the official rules outrank all
      secondary summaries. Mark unknown versions as unknown rather than current.

      ## Available analysis capabilities
      Turn `DEVICE_ACCESS` into a capability matrix: source review, firmware
      extraction, architecture-aware disassembly, emulation, network traffic,
      RF transmit/receive by protocol, reset/reimage, log capture, crash capture,
      and destructive testing. Each row must be `AVAILABLE`, `UNAVAILABLE`, or
      `UNVERIFIED`, with evidence. Never infer live hardware access from a source
      checkout.

      ## Authorized test boundary
      Restate the exact devices, isolated network, radios, and accounts the run is
      allowed to touch. Explicitly prohibit public scanning, unrelated nearby RF
      devices, real customer accounts, and vendor cloud testing unless the
      operator supplied separate written authorization in `DEVICE_ACCESS`.

      ## Evidence gaps and initialization actions
      List missing firmware, version ambiguity, unavailable components, absent
      hardware, or missing tools. For every gap, give the concrete acquisition or
      validation action that would close it. These are limitations, not license
      to fill facts by analogy.

      End after that section. Do not append process commentary.

  - id: initialization-review
    type: check
    backend: claude
    model: claude-opus-5
    bounce_target: initialize-run
    prompt: |
      Review `output/run-profile.md` as the preflight gate for a Pwn2Own Ireland
      2026 Smart Home run against `{{ TARGET_DEVICE }}`.

      Do not modify files. Emit `VERDICT: FAIL: <specific correction>` if any of
      these conditions holds:

      1. The target is missing, is a placeholder, or is not confirmed on the
         current official Smart Home target list at {{ CONTEST_RULES_URL }}.
      2. The target identity, prize, vector, or rules are copied from another
         device or lack an official citation and UTC retrieval timestamp.
      3. Named source/artifact paths were not inventoried, Git inputs lack HEAD
         SHAs, or firmware files lack SHA-256 hashes.
      4. The shipped-version baseline claims `latest` without vendor or Sponsor
         evidence, or hides a mismatch between local inputs and the target build.
      5. Device/RF/emulation capabilities are assumed rather than marked
         AVAILABLE, UNAVAILABLE, or UNVERIFIED with evidence.
      6. The authorized boundary permits public scanning, nearby third-party RF
         targets, customer accounts, or vendor cloud testing without explicit
         authorization.
      7. Status is `BLOCKED`, or a material limitation is omitted instead of
         recorded under evidence gaps.

      `READY_WITH_LIMITATIONS` may pass. Missing hardware or closed source should
      constrain later work, not prevent a useful static-analysis run. If all
      requirements hold, emit `VERDICT: PASS`.

  # ==========================================================================
  # Phase 2 - device recon. Runs once, before any bug hunting, and produces the
  # device-specific ground truth every later role depends on.
  # ==========================================================================
  - id: device-recon
    backend: codex
    model: gpt-5.6-sol
    prompt: |
      You are the device analyst for a Pwn2Own Ireland 2026 entry against the
      {{ TARGET_CATEGORY }} target: **{{ TARGET_DEVICE }}**.

      Attack vector: {{ TARGET_VECTOR }}.
      Candidate analysis roots: {{ SOURCE_ROOTS }}
      Candidate firmware artifacts: {{ FIRMWARE_ARTIFACTS }}
      Declared unavailable components: {{ EXTRA_COMPONENTS }}

      {{ P2O_RULES }}

      ## Your job

      Read `output/run-profile.md` before any other investigation. It pins the
      selected device, current rules, input hashes, shipped-version baseline,
      authorized test boundary, and capabilities available in this run. Do not
      contradict or silently broaden it.

      Write `output/device-recap.md`. Together with the run profile, this is the
      evidence base for the entire run: the attack-surface analyst folds it into the brief injected
      into every captain, worker, and verifier prompt, and the contest-scope
      verifier consults it to decide whether a claimed entry point is even
      reachable under contest conditions. A vague recap produces a run full of
      out-of-scope claims. Precision here is worth more than breadth anywhere
      else in this workflow.

      Do NOT modify any source file. Read, grep, and research only. The only
      file you create is `output/device-recap.md`.

      ## Method

      Use available repository and web-research tools over every source and
      artifact root that initialization confirmed. Research vendor documentation,
      teardowns, firmware analyses, release notes, security advisories, and prior
      Pwn2Own results. Only interact with a live device or RF interface when the
      run profile marks that capability AVAILABLE and the action stays inside its
      authorized boundary. When software is unavailable, say so explicitly
      rather than guessing at behavior.

      **Label every factual claim with its evidence tier.** Downstream verifiers
      demand citations, and an unlabeled guess will be treated as one:

      - `[CODE]` — read directly in a pinned source root. Give `path:line`.
      - `[FIRMWARE]` — observed in a pinned firmware image, filesystem, binary,
        config, or SBOM. Give artifact hash plus path, address, or symbol.
      - `[LIVE]` — observed on the authorized lab device. Give firmware version,
        method, UTC timestamp, and a saved evidence artifact when possible.
      - `[VENDOR]` — vendor documentation, official spec sheet, or release notes.
        Give the URL.
      - `[THIRD-PARTY]` — teardown, blog post, advisory, or write-up. Give the URL
        and note the date, since firmware moves.
      - `[INFERRED]` — your reasoning from the above. Mark it plainly. Inferences
        are useful for prioritization and are NOT acceptable as the basis for a
        scope decision.

      ## Required structure — use these headers verbatim

      # Device Recap — {{ TARGET_DEVICE }}

      ## Contest entry summary
      Category, attack vector, prize, Master of Pwn points, and a one-paragraph
      statement of what a winning demonstration against this specific device
      looks like in concrete terms (which process, running as which user, and
      what observable proof of code execution or data retrieval you would show
      the judges).

      ## Hardware and radios
      SoC, architecture (this determines whether native exploitation is even in
      play), RAM, storage, and every physical interface. Enumerate radios
      explicitly: Ethernet, Wi-Fi, Bluetooth/BLE, Zigbee, Z-Wave, Thread, Matter,
      NFC. For each, state whether it is present on the stock device, whether it
      is enabled in the default configuration, and whether it requires a
      first-party add-on dongle that the contest would or would not have
      attached. **This section decides whether the rules' "RF attack surface"
      clause gives you anything at all.** If the device has no radios, say so
      unambiguously — that collapses the surface to network services only.

      ## Input coverage and confidence
      Summarize the pinned inputs from `output/run-profile.md`: which shipped
      components are backed by current source, which are firmware-only, which
      can be observed live, and which are unavailable. State the consequence of
      each gap. Do not treat a public upstream HEAD as the shipped device build
      unless version evidence connects them.

      ## Software stack and component map
      Every significant software component running on the device: operating
      system, init and supervisor layers, container runtime, application
      runtime, language(s), and the privilege each runs at. For each component,
      state one of:
      - `IN-TREE` — source is in a pinned source root; workers can analyze it.
      - `FIRMWARE-ONLY` — present only as an extracted file or binary; record the
        artifact hash, architecture, path/address, and available symbols.
      - `OUT-OF-TREE` — first-party but not cloned; note the upstream repo.
      - `THIRD-PARTY` — vendored or packaged dependency; note name and version.
      A chain that needs an OUT-OF-TREE link is still worth pursuing, but the
      captain has to know which links it cannot verify locally.

      ## Boot, service activation, and update chain
      Map boot stages, init/service definitions, startup ordering, recovery and
      factory-reset paths, update download/verification/install logic, rollback,
      and trust roots. Identify which services are actually activated in the
      default fully operational state. Record signed-versus-encrypted update
      properties separately. This section is especially important when the input
      is extracted firmware rather than a source repository.

      ## Default-configuration state
      The rules place the device in "default configurations and fully operational
      state", and explicitly exclude "initial-setup, pairing, or otherwise
      uninitialized state". Describe precisely what that means here: what the
      onboarding flow leaves behind, whether a user account exists, whether any
      credential or token is present, which integrations are enabled by default
      with no user action, and what is NOT configured. Be specific about the
      difference between a fresh boot and an onboarded device, because bugs
      reachable only in the former are disqualified.

      ## Network-reachable surface in default configuration
      A table. One row per listening service, and only services that are open in
      the default post-onboarding state:

      | Port | Proto | Service | Process / container | Runs as | Auth required | Evidence |

      Then, below the table, for each row: what the service parses, where in the
      code that parsing begins (`path:line` when IN-TREE), and what an
      unauthenticated peer on the same network segment can reach without any
      credential. Call out separately any service that binds to all interfaces
      versus loopback only — a loopback-only service is not directly reachable
      from the contestant laptop and can only appear as a post-SSRF or
      post-compromise link in a chain.

      ## Unsolicited-input surface (highest value — treat as its own section)
      Handlers that process network input the device did not ask for and that no
      one authenticated: mDNS/zeroconf record parsing, SSDP/UPnP discovery and
      the XML device descriptions it fetches and parses, DHCP sniffing, NetBIOS/
      LLMNR, ARP, IPv6 RA/ND, broadcast and multicast listeners, BLE
      advertisement parsing, Zigbee/Thread/Matter frame handling. These are
      high-value pre-authentication candidates, but unsolicited receipt alone does
      not prove a handler is active, reachable, or unauthenticated. For each:
      prove activation in the default state, the trigger, parsing entry point
      (`path:line` or firmware address/symbol), guards, and where parsed attacker
      data flows next.

      ## Companion, cloud, and cross-device boundaries
      Identify mobile/desktop companion apps, cloud APIs, media/control endpoints,
      and peer devices that influence input consumed by the target. Mark each as
      `DIRECT ENTRY`, `DEPENDENCY`, or `OUT OF CONTEST PATH`. The initial
      vulnerability must be in the registered target, so never turn a companion,
      cloud, or neighboring-device bug into a target claim without a rules-valid
      path that begins in this device.

      ## Authentication and authorization model
      How the device authenticates clients, what token or session formats exist,
      how they are minted and validated, and — critically — the complete list of
      endpoints, handlers, and message types that are reachable BEFORE
      authentication. An auth bypass is a mandatory link in most chains here, so
      describe exactly what such a bypass would have to defeat. Note any
      network-position-based trust (trusted proxies, trusted networks, forwarded
      -header handling, loopback trust) — those are recurring bypass primitives.

      ## Privilege, container, and sandbox boundaries
      What isolates the network-facing code from the device itself: containers,
      namespaces, seccomp, capability sets, read-only mounts, and any privileged
      management API reachable from inside a container. Report these as
      deployment facts.

      The rules require "a full sandbox escape ... if a sandbox is present", but
      do not resolve that conditional yourself from the presence of a container.
      The registered vector is RCE on the device, and code execution in the
      device's own network-facing process is presumed to constitute owning it.
      Say an escape link is required only if the rules text or a Sponsor ruling
      in the run profile designates the component a contest sandbox; where that
      is unsettled, record it as an open Sponsor question and leave it open. A
      recap that resolves an open question toward "escape required" points the
      whole run at a link the rules may not ask for. Enumerate candidate escape
      paths regardless, labelled as entry-hardening.

      ## Sensitive information on the device
      The rules accept retrieval of sensitive information that the Sponsor defines
      for the attempt. Quote that registration definition from the run profile when
      available. Otherwise enumerate only *candidate* high-value secrets on the
      device and state that contest sufficiency is unconfirmed. Give paths or
      binary locations without exposing real secret values in the recap.

      ## Prior Pwn2Own and public vulnerability history
      Research this hard — it is the difference between a paid entry and a
      duplicate. Cover:
      - Prior Pwn2Own entries against this device or its predecessors, with the
        year, the researcher, the bug class, and the ZDI advisory if published.
      - ZDI advisories (zerodayinitiative.com/advisories) naming this vendor or
        product.
      - CVEs and vendor security advisories, including GitHub Security Advisories
        for the in-tree repositories.
      - Recent security-relevant commits, hardening changes, and fixed bug
        classes in the pinned source and firmware inputs.
      Then state, in a short paragraph, which bug classes are now well-trodden on
      this device and which surfaces appear comparatively unexamined.

      ## Contest-rule mapping for this device
      Translate the general rules into device-specific disqualifiers. Concretely:
      which buttons exist on this device and therefore which flows are excluded;
      what is printed on the device label and therefore cannot be used; which
      features exist only during pairing or initial setup and are therefore out
      of scope; which configuration changes would push a chain into non-default
      territory. Be specific enough that a verifier can reject a claim by citing
      a line from this section.

      ## Ranked target list for the captain
      A prioritized list of investigation surfaces, highest expected value first.
      For each: the surface, why it ranks where it does, whether it is reachable
      pre-authentication, whether the code is IN-TREE, and the chain role it
      would fill (initial access / primitive / code execution / sandbox escape).

      ## Open questions and unverified assumptions
      Everything you could not establish. Anything a worker or verifier might
      otherwise assume silently. Be honest here — an acknowledged gap is far
      cheaper than a confident error that misdirects a hundred worker-hours.

      End the file after this section. Do not append commentary about your own
      process.

  - id: recap-review
    type: check
    backend: codex
    model: gpt-5.6-sol
    bounce_target: device-recon
    prompt: |
      Review `output/device-recap.md` for the Pwn2Own Ireland 2026
      {{ TARGET_CATEGORY }} entry against {{ TARGET_DEVICE }}.

      Read `output/run-profile.md` too. The recap must remain consistent with its
      pinned identity, version, artifact hashes, capabilities, and authorization
      boundary. This recap is injected into every downstream agent prompt and is the basis
      for contest-scope rejections. It has to be right. Check:

      1. The file exists and uses every required section header.
      2. The "Network-reachable surface in default configuration" table has real
         ports, real processes, and an explicit auth column — not placeholders,
         and not a list of services that only exist during initial setup.
      3. The "Hardware and radios" section classifies each RF surface as PRESENT,
         ABSENT, or UNKNOWN with evidence. UNKNOWN is allowed when initialization
         recorded the evidence gap, but downstream scope decisions must treat it
         as unavailable until confirmed.
      4. The "Authentication and authorization model" section actually
         enumerates pre-authentication reachable handlers. A chain cannot be
         scoped without this.
      5. Factual claims carry `[CODE]` / `[VENDOR]` / `[THIRD-PARTY]` /
         `[INFERRED]` labels, and `[CODE]` claims cite `path:line`.
      6. "Prior Pwn2Own and public vulnerability history" shows evidence of real
         research — named advisories, CVE identifiers, or commits — not a generic
         statement that the project has had vulnerabilities.
      7. "Input coverage and confidence" and "Boot, service activation, and
         update chain" distinguish source-backed, firmware-only, live-observed,
         and unavailable components, and do not equate upstream HEAD with shipped
         firmware without version evidence.
      8. "Companion, cloud, and cross-device boundaries" prevents bugs outside
         the registered target from being mistaken for valid initial links.
      9. "Contest-rule mapping for this device" is specific enough to reject a
         claim by citation.

      Do not modify any files. If the recap is missing sections, hand-waves the
      default-configuration state, or contains unlabeled speculation presented as
      fact, emit `VERDICT: FAIL: <specific gaps to fix>`. Otherwise emit
      `VERDICT: PASS`.

  # ==========================================================================
  # Phase 3 - the hunt.
  # ==========================================================================
  - id: hunt-bugs
    type: analysis
    prompt: |
      You are hunting a Pwn2Own Ireland 2026 entry against the
      {{ TARGET_CATEGORY }} target: **{{ TARGET_DEVICE }}**.

      Attack vector: {{ TARGET_VECTOR }}.
      Analysis roots: {{ SOURCE_ROOTS }}

      Read `output/run-profile.md` and then `output/device-recap.md` before doing
      anything else. Together they are the device-specific evidence base for this run - hardware, radios, default-
      configuration listening services, pre-authentication surface, sandbox
      boundaries, and prior public findings. The attack-surface analyst has also
      folded it into the project brief injected above.

      {{ P2O_RULES }}

      ## Mission

      Find a chain that wins the contest. Not a bug list — a chain.

      A winning entry starts with an unauthenticated attacker on the contest
      network holding nothing but network and RF reach to the device, and ends
      with arbitrary code execution on the device or retrieval of sensitive
      information from it, fully automated, in one command, inside a ten-minute
      window, against a stock fully-patched device in its default configuration.

      Every intermediate finding is judged by whether it advances that chain.

      ### The chain model

      Think in four links. Every target you spawn, and every claim you file,
      should declare which link it fills:

      - **Link A — initial reach.** An unauthenticated, unsolicited path from the
        contest network or an RF interface into code on the device. Discovery
        protocol handlers, pre-auth HTTP routes, broadcast and multicast
        listeners, radio frame parsers. No credential, no pairing, no button.
      - **Link B — primitive.** Something that bends execution or reads/writes
        state it should not: memory corruption, command injection, unsafe
        deserialization, template injection, path traversal into a written file,
        SSRF into a privileged internal API, or an authentication bypass that
        promotes the attacker into a credentialed role.
      - **Link C — winning impact.** The primitive converted into arbitrary code
        execution on the device or retrieval of the exact sensitive information
        the Sponsor defines for this entry. Do not guess that definition; use the
        run profile and registration details, and otherwise prioritize RCE.
      - **Link D — escape, only if the Sponsor requires it.** The registered
        attack vector is Remote Code Execution on the device. Link C is the win;
        Link D is not a fourth mandatory link and must not be treated as one by
        default.

        Containerized is not the same as sandboxed. Nearly every modern
        appliance ships its main application in a container, systemd unit, or
        service account; that is deployment, not an exploit-mitigation boundary.
        The rules pair "sandbox" with DEP and ASLR — mitigations designed to
        contain exploitation — so the escape requirement attaches to a
        confinement boundary the Sponsor designates as one, not to the mere fact
        that the process runs in a namespace. If the target's own primary
        application is the thing you executed code in, you have compromised the
        target.

        Treat this link as **required only when the run profile records a
        Sponsor ruling that says so.** Where the recap leaves the question open,
        it is open: pursue Link C, note that an escape would harden the entry,
        and put the question to the Sponsor rather than silently spending the
        run on an extra link the rules may not ask for.

      A chain is complete when every required link is verified. A single verified
      Link B with no path to Link A is not an entry; a verified Link A that
      reaches only unreachable code is not an entry. **Partial chains are still
      valuable** — file them, mark the missing link, and spawn targets aimed
      squarely at the gap.

      ### An authentication bypass is usually mandatory

      This deserves its own statement because it invalidates the majority of
      plausible-looking findings on smart-home targets.

      Some smart-home devices grant an authenticated administrator broad power by
      design; others expose only narrow control operations. The recap must establish
      the actual role capabilities for this target. Demonstrating a documented
      administrator capability is intended behavior, not a vulnerability.

      The rules say the exploit "must occur prior to authentication to the
      service or include an authentication bypass." So:

      - Chains that begin unauthenticated are entries.
      - Chains that begin authenticated are entries **only** when the same chain
        also demonstrates obtaining that authentication without credentials, and
        without any disqualified precondition.
      - Chains that assume a stolen token, a phished password, a shared network
        secret, or a pre-paired client are not entries.

      When you find an authenticated-only path to code execution, do not discard
      the knowledge — record it as a **Link C candidate awaiting a Link B auth
      bypass**, and spawn targets hunting that bypass. That is often the real
      shape of a winning chain on these devices.

      ### Investigation lanes

      Keep multiple evidence lanes active so the run does not overfit to whichever
      input format is easiest to search. Only dispatch a lane when the run profile
      says its required capability or artifact is available.

      1. **Reachability and activation** - prove default-state listeners, radio
         handlers, exposed features, authentication ordering, and the exact bytes
         controlled by a contestant laptop.
      2. **Source dataflow** - follow attacker-controlled fields through parsers,
         state machines, trust checks, IPC, files, and dangerous sinks in pinned
         source. Include build flags and deployment configuration.
      3. **Firmware and binary analysis** - extract filesystems and update packages;
         map services from init/config; identify architecture, mitigations, imports,
         strings, protocol dispatchers, and vulnerable native parsing; correlate
         every result to the pinned artifact hash and address/symbol.
      4. **Protocol and live validation** - derive protocol grammars, capture a
         clean baseline, mutate one dimension at a time, preserve PCAP/log/crash
         evidence, and restore a fresh default operational state between trials.
      5. **Privilege and update boundaries** - analyze internal management APIs,
         IPC, sandbox/container escape paths, signed-update verification, rollback,
         and persistence only where they complete a rules-valid chain.
      6. **Chain integration and variants** - connect independently proven links,
         measure automation/reliability, and sweep sibling code after a verified
         defect or a historically fixed bug class.

      A target packet must name its lane, exact component/artifact and version,
      required capability, chain link, attacker-controlled input, success evidence,
      and stop condition. Do not assign live/RF work to a static-only worker, or
      source-line work to a firmware-only component.

      ### What counts

      Prioritize by what the recap says the device is actually built from. The
      recap's "Software stack and component map" section decides which of these
      lists dominates.

      **When the exposed surface is memory-unsafe (C / C++ / unsafe Rust
      firmware, native daemons, radio stacks, codecs):** memory safety first.
      Buffer overflows, use-after-free, double-free, out-of-bounds read/write,
      type confusion, integer overflow into corruption, uninitialized reads.
      Sanitizer output (ASan / UBSan / MSan / TSan) or a hard crash trace is the
      strongest evidence this workflow can produce. Reach for existing fuzz
      harnesses under `fuzz/`, `tests/fuzz/`, `oss-fuzz/` first.

      **When the exposed surface is memory-safe (Python, Go, Java, Node, managed
      runtimes):**
      memory-safety hunting is mostly wasted effort. The winning classes are:

      - **Command and argument injection** — `subprocess` with `shell=True`,
        `os.system`, unquoted interpolation into shell strings, argument
        injection into a trusted binary via a leading dash.
      - **Unsafe deserialization** — `pickle`, `marshal`, `yaml.load` /
        `yaml.unsafe_load` / `yaml.full_load`, `jsonpickle`, custom object
        reconstruction, over any attacker-reachable byte stream.
      - **Template injection** — template engines rendering attacker-controlled
        template *source* rather than attacker-controlled *data*. Establish the
        actual engine, sandbox policy, and pre-auth dataflow on this device.
      - **Path traversal into a write** — upload, backup, restore, extraction,
        media, and download handlers. An arbitrary file write on these devices is
        usually one restart or one config-reload away from code execution. Also
        cover archive extraction: zip-slip and tar-slip, symlink traversal,
        absolute paths in archive members.
      - **Authentication and authorization bypass** — token minting and
        validation flaws, signature verification errors, signed-URL/signed-path
        weaknesses, login flow state-machine abuse, session fixation, refresh
        token handling, WebSocket authentication ordering, CORS and origin
        checks, and network-position trust: forwarded-header spoofing, trusted-
        proxy handling, loopback-trust confusion.
      - **SSRF into a privileged internal API** — the recap lists loopback-only
        services; an SSRF that reaches a privileged supervisor or management API
        is frequently the whole ballgame on containerized smart-home devices.
      - **Injection into structured sinks** — SQL injection, XML external
        entities, LDAP, and header injection / request smuggling where a proxy
        and an application server disagree about framing.
      - **Discovery-data flow bugs** — attacker-controlled mDNS, SSDP, or DHCP
        fields flowing into config flows, file paths, URLs the device then
        fetches, or commands. They are disproportionately valuable after default
        activation and lack of an authentication guard are proven.

      **Always in scope regardless of language:** sandbox and container escapes
      that convert code execution in a confined process into control of the
      device, since the rules require that escape when a sandbox is present.

      ### What does NOT count

      - **Anything requiring authentication with no bypass in the chain.** The
        single largest source of wasted effort on this target class.
      - **Intended administrative functionality.** An admin running a script,
        installing an add-on, or evaluating a template is the product, not a bug.
      - **Denial of service.** Crashes, hangs, resource exhaustion, and stuck
        state machines are not "arbitrary code execution or ... sensitive
        information". They are only relevant as an observable side effect proving
        a memory-corruption primitive that a chain then develops.
      - **State mutation without code execution or data theft** — toggling
        entities, poisoning caches, corrupting configuration, unpairing devices.
        Even unauthenticated, this is not a contest win.
      - **Anything requiring a disqualified precondition** — pressing a button,
        reading a PIN or code printed on the device, being paired beforehand, or
        the device sitting in initial-setup or uninitialized state.
      - **Anything requiring non-default configuration**, unless the recap
        establishes the setting is plainly within "the normal use case of the
        target under test" — and even then, flag the dependency.
      - **Anything requiring user interaction**, reboots, or logoff/logon during
        the attempt.
      - **Physical attacks** — disassembly, debug headers, UART/JTAG, chip-off.
        Out of the category's stated attack surface.
      - **Bugs in test code, examples, or developer tooling** that never runs on
        the shipped device.
      - **Already-public vulnerabilities.** The rules require the vulnerability
        be "unknown, unpublished, and/or not previously reported".

      ### Captain guidance

      You are the strategic coordinator. Build a model of the device's exposed
      surface from the recap, then decompose it into bounded investigation
      targets workers can execute independently.

      **Operate with evidence-driven breadth.** Run enough independent targets to
      cover every confirmed entry point and every applicable investigation lane,
      while avoiding quota-filling duplicates. Coverage and chain completeness
      matter more than raw target count. The engine enforces modest floors only to
      prevent a shallow first pass.

      **Per-turn fanout (hard expectation).** While `UNCOVERED SURFACE` in your
      `mental_model_summary` is non-empty, every turn must enqueue 4-8 bounded new
      targets, spread across different applicable investigation lanes and:
      - Unexplored entry points from the recap's ranked target list
      - Gaps in partially-complete chains (see `CHAINS` below) — a missing Link A
        for a verified Link B is the highest-value target you can spawn
      - Variant-analysis follow-ups for recently verified or rejected claims
      - Deeper drills into the highest-yield surfaces already in flight

      **Front-load proven unsolicited-input surfaces.** The recap has a dedicated
      section for them. Discovery protocol parsers, broadcast/multicast listeners,
      and radio frame handlers are often pre-authentication, but only after the
      activation path and guards are established for the default device state.
      Give early priority to confirmed surfaces; assign separate reachability
      targets to candidates whose activation is still unknown.

      **Variant-analysis policy (apply every turn that has new evidence):**
      - **Verified claim**: the bug is a leaf — do NOT respawn it. Treat it as
        proof the surface is fertile. Spawn targets in the surrounding subsystem:
        sibling handlers, callers and callees, related modules, and structurally
        identical patterns elsewhere. Separately, spawn targets for the chain
        links this claim does not yet supply.
      - **Rejected claim**: the path was wrong, not necessarily the surface.
        Spawn targets for alternate paths to the same sink, sibling code that may
        lack the verifier-identified guard, or a different vulnerability class on
        the same surface. When the rejection was `requires-authentication`, spawn
        auth-bypass targets — the sink is confirmed good, only the reach is
        missing.
      - **No-findings target**: do NOT re-investigate the same scope. Only spawn
        an adjacent fresh-angle target if you have a concrete new reason.
      - **Blocked target**: do NOT respawn until the blocker is addressed.
      - **Dependency-stranded target**: the exception — DO re-enqueue it, with
        `depends_on_claim_ids: []`. It never ran; its dependency claim was
        rejected so the gate could never open. Inline whatever the rejected
        claim established into `instructions` and keep going.

      Priority order, adjusted by what the recap says the device runs:
      1. Unauthenticated network services and the parsers behind them
      2. Unsolicited-input handlers — mDNS/zeroconf, SSDP/UPnP, DHCP, LLMNR,
         broadcast/multicast listeners, and any RF frame parsing the recap
         confirms exists on the stock device
      3. Authentication and authorization machinery itself — token minting and
         validation, session handling, network-position trust, the login state
         machine. A bypass here unlocks every authenticated sink on the device.
      4. Pre-auth HTTP/API routes, including routes that are nominally
         authenticated but whose auth check runs after parsing
      5. Parsers of attacker-supplied files and archives — backup, restore,
         upload, media, extraction
      6. Paths from a compromised confined process to the host: privileged
         management APIs reachable from inside the sandbox, container escapes,
         IPC and D-Bus surfaces, update and image-verification mechanisms
      7. Code surrounding prior public findings on this device (variant analysis
         against the recap's history section)
      8. Integration points that fetch and parse remote content the attacker can
         influence
      9. Firmware boot/update/recovery code and binary-only services proven to
         ship, especially where source coverage is absent

      Adapt aggressively: if a surface yields repeated no-findings or rejections,
      deprioritize it and pivot. If a verified claim opens a seam toward a
      missing chain link, follow it immediately.

      #### Coverage expectations

      Your `mental_model_summary` MUST use the `SUBSYSTEMS`, `ENTRY POINTS`,
      `UNCOVERED SURFACE`, and `NOTES` sections defined in the captain role
      prompt, plus `EVIDENCE LANES` and `CHAINS` appended after `NOTES`:

          EVIDENCE LANES:
            - reachability-and-activation: active - 6/8 confirmed entry points covered
            - source-dataflow: active - pinned source at <sha>
            - firmware-and-binary: blocked - no firmware artifact in run profile
            - protocol-and-live: unavailable - static-analysis-only run

          CHAINS:
            - chain-1 [incomplete] — A: verified (claim-14, mDNS TXT parser reachable
              pre-auth). B: verified (claim-22, traversal into config write). C: MISSING
              — need a reload/execution path that consumes the written file. D: n/a per
              recap (no sandbox on this component).
            - chain-2 [stalled] — A: MISSING. B: verified (claim-31, template injection),
              authenticated-only. Spawned target-77/78/79 hunting auth bypass.

      Every turn, update `EVIDENCE LANES` and `CHAINS` alongside the other sections. Each chain names
      its links, the claim backing each verified link, and the specific missing
      link. This is how the run stays pointed at an entry rather than
      accumulating disconnected findings.

      Before declaring `termination_state: "complete"`, you must have:
      1. Enumerated every externally reachable entry point from the recap's
         network-reachable and unsolicited-input sections in `ENTRY POINTS`, and
         reached `covered` or `dry-hole` for each.
      2. Reached `covered` or `dry-hole` for every entry in `SUBSYSTEMS`.
      3. Followed every verified finding to adjacent attack surface per the
         variant-analysis policy.
      4. Pursued the missing link of every `incomplete` or `stalled` chain until
         it is either closed or demonstrably a dead end, with the reason recorded.
      5. Every applicable evidence lane is covered or has an explicit run-profile
         blocker; unavailable lanes do not count as silently covered.
      6. Explored at least 3 different vulnerability classes from "What counts".
      7. `UNCOVERED SURFACE` is empty (`(none)`).

      If you run out of high-priority targets, pivot to medium-priority
      exploration of unexplored surface and add it to your spawn batch — do NOT
      terminate. The engine will reject premature `complete` declarations until
      the configured floors are met.

      ### Worker guidance — PoCs are mandatory

      Every claim must include a concrete trigger that reaches the alleged sink
      and produces the alleged effect. Static "this could be a bug" arguments are
      not findings. The verifier will attempt to reproduce your PoC; if it does
      not reproduce, the claim is rejected.

      **A working PoC alone does not earn passage.** Two semantic gates run
      before reproduction. `p2o-scope` judges whether the entry point and its
      preconditions are legal under contest rules. `preauth-impact` judges
      whether the attacker starts unauthenticated and whether the outcome is a
      contest win. A flawless reproduction of an authenticated-admin code-exec
      path is rejected at the second gate every time.

      **Prefer PoCs that drive the real service over the network.** For a
      device target, the gold standard is a crafted packet, frame, or request
      sent to a running instance of the actual service - in a container, VM, or
      emulator - producing the alleged effect. Calling an internal implementation
      function directly proves the function is buggy; it does not prove an
      attacker can reach it. Reaching for the real listener also surfaces the
      guards that sit between the wire and the sink, which is exactly what the
      later gates will ask about.

      **Build with sanitizers when memory unsafety is plausible** — for native
      components, try `-fsanitize=address,undefined`, the project's existing ASan
      target, or an existing fuzz harness.

      **Output:** workers do NOT write under `output/`. The runner gives each
      worker a private scratch directory under `.juvenal/scratch/<task_id>/` —
      that is the only place a worker may drop PoC artifacts. On `no_findings` or
      `blocked`, write nothing to disk; just return the structured JSON. The
      `output/` tree is owned by the reporter agent.
    analysis:
      # Opus 5 has a fixed 1M context window, so no context suffix is needed.
      # GPT-5.6 Sol provides a 1.05M context window for technical investigation.
      # Bare backend names select the installed SDK by default; these explicit
      # model IDs pass through unchanged on SDK and CLI paths.
      captain_backend: claude
      captain_model: claude-opus-5
      worker_backend: codex
      worker_model: gpt-5.6-sol
      # Shared budget: all parallel agents draw from one pool, with verifier
      # dispatch preempting worker dispatch, so newly-proposed claims clear the
      # chain before more workers spin up.
      #
      # NOTE: this workflow runs a FIVE-stage verifier chain (bug-bounty.yaml
      # runs four), and the chain is sequential per claim. Verification is
      # therefore the throughput bottleneck. Eight shared slots leave room for a
      # full verifier chain plus workers in distinct evidence lanes.
      shared_agent_budget: true
      max_agents: 8
      # max_workers / max_verifiers are unused under shared_agent_budget: true.
      # Set shared_agent_budget: false (and uncomment below) to fall back to
      # legacy independent pools.
      # max_workers: 4
      # max_verifiers: 12
      interaction_timeout: 3.0
      max_worker_retries: 3
      max_captain_repairs: 4
      allow_repo_tools: true
      # Each worker fans out into its own subagents to work competing
      # hypotheses within its one assigned target, then synthesizes a single
      # WORKER_JSON. This is the engine default; stated explicitly because the
      # worker prompt below leans on it. Set false for a legacy single-pass
      # worker.
      worker_dynamic_workflow: true
      # Engine-enforced floors prevent a shallow pass without rewarding duplicate
      # quota-filling. The prompt's entry-point/lane/chain coverage is the real bar.
      min_captain_turns: 12
      min_terminal_targets_before_complete: 48
      # Soft escape: after this many consecutive overridden `complete`
      # declarations, the engine accepts completion to avoid an infinite nudge
      # loop on a dry target.
      max_premature_completes: 3
      continue_nudge: |
        ## Continue nudge — Pwn2Own coverage floors not yet met

        The engine has REJECTED your `complete` declaration (override #{consecutive} of
        {max_premature_completes}). Status: {turns} captain turn(s) elapsed; {terminal} target(s)
        in terminal state. Required floors: >= {min_captain_turns} captain turns AND
        >= {min_terminal_targets} terminal targets. This is a coverage-driven contest-prep
        run; distinct evidence and chain completeness matter more than raw volume.

        Required actions for THIS turn:

        1. Update `mental_model_summary` with structured coverage accounting (SUBSYSTEMS,
           ENTRY POINTS, UNCOVERED SURFACE, NOTES, EVIDENCE LANES, CHAINS). UNCOVERED SURFACE must be empty
           before `complete` is allowed, and every CHAINS entry must be `complete` or carry a
           recorded dead-end reason.
        2. Re-read the ranked target list and the unsolicited-input section of
           `output/device-recap.md`. Any entry point there not yet in ENTRY POINTS with
           `covered` or `dry-hole` status is uncovered surface — enqueue it.
        3. Apply the variant-analysis policy:
           - Verified claim: spawn targets in the surrounding subsystem, and separately spawn
             targets for the chain links that claim does not supply. Do NOT respawn the bug.
           - Rejected claim: spawn alternate paths to the same sink, sibling code lacking the
             verifier-identified guard, or a different vulnerability class on the same surface.
             If the rejection was `requires-authentication`, spawn auth-bypass targets — the
             sink is confirmed, only the pre-auth reach is missing.
           - No-findings target: do NOT re-investigate; only spawn an adjacent fresh-angle
             target if you have a concrete new reason.
           - Blocked target: do NOT respawn until the blocker is addressed.
           - Dependency-stranded target: DO re-enqueue with `depends_on_claim_ids: []` —
             it never ran, so nothing is known about the work itself.
        4. Enqueue 4-8 non-duplicate targets across applicable evidence lanes. Bias toward
           proven unauthenticated reach: active discovery parsers, broadcast/multicast
           listeners, RF handlers the recap confirms exist, and authentication machinery.
           Do not enqueue work whose required capability is unavailable in the run profile.
        5. Return `termination_state: "continue"`. Do not declare `complete` again until both
           floors are met AND UNCOVERED SURFACE is empty AND every evidence lane is covered
           or explicitly blocked AND no chain is stalled without a recorded reason.
