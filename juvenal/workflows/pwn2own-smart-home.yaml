        between the wire and the sink, and does it hold?), and the PoC-strategy
        question (what is the cheapest way to demonstrate the effect against a
        live instance?). Those are genuinely independent and parallelize well.

        This never changes your contract: you return exactly one WORKER_JSON with
        one `outcome` and the same claim shape — never one block per subagent,
